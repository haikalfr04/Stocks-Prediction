[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockpred"
version = "0.1.0"
description = "Prediksi return harian saham ASII, BBRI, dan TLKM selama 2026 dengan validasi walk-forward."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
download = ["yfinance>=0.2.54"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
